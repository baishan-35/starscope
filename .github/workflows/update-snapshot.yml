name: Build & deploy Starscope

# Deploy to Cloudflare Pages. GitHub Actions owns the build + the 6-hourly
# snapshot refresh, then publishes the static site to Cloudflare Pages
# (free global CDN + HTTPS + custom response headers via site/_headers).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Star-count history persists across runs so trending gains can be
      # computed as snapshot deltas (stars_now - stars_N_days_ago) instead of
      # scraped Trending text. First run starts empty and falls back to the
      # page text; coverage takes over as history accumulates.
      - name: Restore star-count history
        uses: actions/cache@v4
        with:
          path: stars_history.json
          key: stars-history-v1-${{ github.run_number }}
          restore-keys: |
            stars-history-v1-

      - name: Build site (refresh snapshot, strict validation)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Public origin for canonical / og:url / sitemap. Set repo
          # Settings > Variables > SITE_URL to your Cloudflare Pages URL or
          # custom domain, e.g. https://starscope-adb.pages.dev (no trailing slash).
          SITE_URL: ${{ vars.SITE_URL }}
          CI: "true"
        run: python build_github_explorer.py --force --ci

      - name: Static checks
        run: |
          node --check src/app.js
          node tests/smoke.js
          node tests/contrast.js
          node tests/function-check.js

      # The error-report sink (site/functions/api/errors.js) persists into a
      # KV namespace. Config-as-code: when the namespace exists (created here
      # if missing, best-effort — the deploy token may lack KV scope), a
      # wrangler.toml attaches the ERRORS_KV binding at deploy time. Without
      # it the function still accepts beacons and logs them, so nothing breaks.
      - name: Ensure KV namespace for error reports
        id: kv
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TITLE="starscope-errors"
          ID=$(npx --yes wrangler@3 kv namespace list 2>/dev/null \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const n=a.find(x=>x.title.endsWith("starscope-errors"));if(n)console.log(n.id)}catch(e){}})' || true)
          if [ -z "$ID" ]; then
            OUT=$(npx --yes wrangler@3 kv namespace create "$TITLE" 2>&1) || { echo "$OUT"; exit 1; }
            ID=$(printf '%s' "$OUT" | grep -oE '[0-9a-f]{32}' | head -1 || true)
            if [ -z "$ID" ]; then echo "could not parse namespace id:"; echo "$OUT"; exit 1; fi
          fi
          {
            echo 'name = "starscope"'
            echo 'pages_build_output_dir = "site"'
            echo 'compatibility_date = "2026-11-01"'
            echo ''
            echo '[[kv_namespaces]]'
            echo 'binding = "ERRORS_KV"'
            echo "id = \"$ID\""
          } > wrangler.toml
          echo "ERRORS_KV namespace: $ID"

      - name: Publish to Cloudflare Pages (with KV binding)
        id: deploy_kv
        continue-on-error: true
        if: steps.kv.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=starscope --branch=main --commit-dirty=true

      - name: Drop wrangler config for the plain fallback
        if: steps.deploy_kv.outcome == 'failure'
        run: rm -f wrangler.toml

      - name: Publish to Cloudflare Pages (plain, no bindings)
        if: steps.kv.outcome != 'success' || steps.deploy_kv.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=starscope --branch=main --commit-dirty=true
