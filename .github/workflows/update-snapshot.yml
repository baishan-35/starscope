name: Refresh catalogue snapshot

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh snapshot (strict validation)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          CI: "true"
        run: python build_github_explorer.py --force --ci

      - name: Static checks
        run: |
          node --check src/app.js
          node tests/smoke.js
          node tests/contrast.js

      - name: Commit refreshed snapshot when changed
        run: |
          git config user.name "starscope-bot"
          git config user.email "starscope-bot@users.noreply.github.com"
          git add site/ github-explorer.html
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "chore: refresh GitHub catalogue snapshot"
            git push
          fi
