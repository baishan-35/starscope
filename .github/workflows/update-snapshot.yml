name: Build & deploy Starscope

# Tier A fix: CI now actually deploys. Every run builds the static site and
# publishes it to GitHub Pages (free HTTPS + global CDN). A push to main, the
# 6-hourly schedule, or a manual dispatch all trigger a fresh deploy.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

# Pages needs pages:write + id-token:write; checkout only needs contents:read.
# We no longer commit the built site back, so contents:write is not required
# and there is no self-triggering loop.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build site (refresh snapshot, strict validation)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Default to the GitHub Pages project URL (https://<owner>.github.io/<repo>).
          # Override with a custom domain via repo Settings > Variables > SITE_URL.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          CI: "true"
        run: python build_github_explorer.py --force --ci

      - name: Static checks
        run: |
          node --check src/app.js
          node tests/smoke.js
          node tests/contrast.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
